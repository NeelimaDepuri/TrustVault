<!DOCTYPE html>
<html>
<body>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<h2>Audit Logs</h2>

<table border="1">

<tr>
<th>Action</th>
<th>User</th>
<th>Time</th>
</tr>

{% for log in logs %}

<tr>
<td>{{ log.action }}</td>
<td>{{ log.user_email }}</td>
<td>{{ log.created_at }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
