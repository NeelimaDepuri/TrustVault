<!DOCTYPE html>
<html>
<body>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<h2>Register</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<br><br>

<input
type="email"
name="email"
placeholder="Email"
required>

<br><br>

<input
type="password"
name="password"
placeholder="Password"
required>

<br><br>

<select name="role">

<option value="Admin">Admin</option>

<option value="Owner">Owner</option>

<option value="Viewer">Viewer</option>

</select>

<br><br>

<button type="submit">
Register
</button>

</form>

</body>
</html>
