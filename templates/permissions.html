<!DOCTYPE html>
<html>
<body>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<h2>Grant Access</h2>

<form method="POST">

    <input
        type="email"
        name="email"
        placeholder="User Email"
        required>

    <br><br>

    <select name="access">
        <option value="Read">Read</option>
        <option value="Edit">Edit</option>
    </select>

    <br><br>

    <button type="submit">
        Grant Access
    </button>

</form>

</body>
</html>
